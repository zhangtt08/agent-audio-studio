description = "AgentAudio desktop app"

[[bin]]
name = "agentaudio-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
agentaudio-core = { path = "../core" }
serde_json = "1"
